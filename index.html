<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubham Aggarwal</title>
  <meta name="description" content="Shubham Aggarwal — software engineer.">
  <link rel="canonical" href="https://shubham-aggarwal.tech/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #5a5a5a;
      --rule: #e2e2e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131313;
        --fg: #ececec;
        --muted: #9a9a9a;
        --rule: #2c2c2c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12vh 1.5rem 4rem;
      background: var(--bg);
      color: var(--fg);
      font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 34rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--rule);
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: border-color 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      border-bottom-color: var(--fg);
    }
  </style>
</head>

<body>
  <main>
    <h1>Shubham Aggarwal</h1>

    <!-- TODO: replace with your actual one-line bio before publishing. -->
    <p>Software engineer.</p>

    <nav>
      <a href="https://github.com/Shubham-Aggarwal-1306">GitHub</a>
      <a href="https://www.linkedin.com/in/shubham-aggarwal-654ab521a/">LinkedIn</a>
    </nav>
  </main>
</body>

</html>
